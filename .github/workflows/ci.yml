name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: citefin_test
          POSTGRES_USER: citefin
          POSTGRES_PASSWORD: citest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U citefin -d citefin_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
          enable-cache: true
      - name: Install dependencies
        run: make setup
      - name: Verify PostgreSQL migrations
        env:
          CITEFIN_ENVIRONMENT: test
          CITEFIN_DATABASE_URL: postgresql+psycopg://citefin:citest@localhost:5432/citefin_test
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Run quality gate
        run: make check
