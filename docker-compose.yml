services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CITEFIN_ENVIRONMENT: development
      CITEFIN_DATABASE_URL: postgresql+psycopg://citefin:citefin@postgres:5432/citefin
      CITEFIN_REDIS_URL: redis://redis:6379/0
      CITEFIN_OBJECT_STORAGE_ROOT: /app/data/objects
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - object-data:/app/data/objects
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      CITEFIN_ENVIRONMENT: development
      CITEFIN_DATABASE_URL: postgresql+psycopg://citefin:citefin@postgres:5432/citefin
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: citefin
      POSTGRES_USER: citefin
      POSTGRES_PASSWORD: citefin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citefin -d citefin"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  object-data:
  postgres-data:
  redis-data:
