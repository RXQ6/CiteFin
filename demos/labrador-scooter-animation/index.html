<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="黄色拉布拉多戴着头盔骑电瓶车的 SVG 2D 循环动画">
  <title>兜风去！黄色拉布拉多 SVG 动画</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #173044;
      --paper: #fffaf0;
      --sun: #ffc857;
      --red: #e55745;
      --blue: #2d7792;
      --mint: #86bfa3;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 15%, rgba(255,255,255,.72), transparent 28%),
        linear-gradient(150deg, #ffd991 0%, #f1a985 50%, #a85c78 100%);
      font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }

    .stage {
      width: min(1180px, calc(100vw - 28px));
      border: 4px solid rgba(23, 48, 68, .88);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      background: #f5b47d;
      box-shadow: 0 24px 64px rgba(70, 30, 46, .34), inset 0 0 0 2px rgba(255,255,255,.35);
      isolation: isolate;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
    }

    .topbar {
      position: absolute;
      z-index: 5;
      inset: 0 0 auto 0;
      padding: clamp(14px, 2.5vw, 28px);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .title-block {
      color: #fffaf0;
      text-shadow: 0 2px 0 rgba(23,48,68,.22);
    }

    .eyebrow {
      display: block;
      margin-bottom: 2px;
      font-size: clamp(.72rem, 1.3vw, .9rem);
      font-weight: 800;
      letter-spacing: .2em;
      opacity: .85;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.7rem, 4.8vw, 3.9rem);
      font-style: italic;
      line-height: .95;
      letter-spacing: -.04em;
    }

    .controls {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    button {
      min-height: 44px;
      padding: 0 15px;
      border: 2px solid rgba(23,48,68,.84);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,250,240,.9);
      box-shadow: 0 5px 0 rgba(23,48,68,.72);
      font: 800 .9rem/1 system-ui, sans-serif;
      cursor: pointer;
      backdrop-filter: blur(7px);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    button:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 6px 0 rgba(23,48,68,.72); }
    button:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(23,48,68,.72); }
    button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

    .caption {
      position: absolute;
      z-index: 5;
      left: clamp(14px, 2.5vw, 28px);
      bottom: clamp(14px, 2.5vw, 26px);
      margin: 0;
      padding: 9px 14px;
      border: 2px solid rgba(23,48,68,.76);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,250,240,.86);
      box-shadow: 0 4px 0 rgba(23,48,68,.62);
      font-size: clamp(.76rem, 1.5vw, .95rem);
      font-weight: 800;
      letter-spacing: .04em;
      backdrop-filter: blur(7px);
    }

    .moving { animation-play-state: running; }
    .paused, .paused * { animation-play-state: paused !important; }

    #scene { --speed: 1; }
    #scene.fast { --speed: .62; }

    .clouds-near { animation: drift calc(18s * var(--speed)) linear infinite; }
    .clouds-far { animation: drift calc(30s * var(--speed)) linear infinite; }
    .far-hills { animation: drift calc(20s * var(--speed)) linear infinite; }
    .near-trees { animation: drift calc(7s * var(--speed)) linear infinite; }
    .road-marks { animation: drift calc(1.8s * var(--speed)) linear infinite; }
    .dust { animation: drift calc(2.4s * var(--speed)) linear infinite; }
    .rider { animation: bob calc(.72s * var(--speed)) ease-in-out infinite; transform-origin: 650px 410px; }
    .tail { animation: wag calc(.28s * var(--speed)) ease-in-out infinite alternate; transform-origin: 558px 334px; }
    .ear { animation: ear-flap calc(.58s * var(--speed)) ease-in-out infinite alternate; transform-origin: 642px 272px; }
    .scarf-end { animation: scarf calc(.7s * var(--speed)) ease-in-out infinite alternate; transform-origin: 589px 352px; }
    .wheel { animation: spin calc(.82s * var(--speed)) linear infinite; transform-box: fill-box; transform-origin: center; }
    .blink { animation: blink 4.4s infinite; transform-box: fill-box; transform-origin: center; }
    .speed-line { animation: streak calc(1.3s * var(--speed)) linear infinite; }
    .speed-line.delay { animation-delay: -.55s; }
    .helmet-shine { animation: glint 3.6s ease-in-out infinite; }

    @keyframes drift { to { transform: translateX(-1200px); } }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-.25deg); } 50% { transform: translateY(-5px) rotate(.35deg); } }
    @keyframes wag { from { transform: rotate(-16deg); } to { transform: rotate(13deg); } }
    @keyframes ear-flap { from { transform: rotate(-2deg); } to { transform: rotate(9deg); } }
    @keyframes scarf { from { transform: rotate(-4deg) scaleY(.95); } to { transform: rotate(7deg) scaleY(1.05); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 0%,44%,48%,100% { transform: scaleY(1); } 46% { transform: scaleY(.08); } }
    @keyframes streak { from { transform: translateX(0); opacity: 0; } 15% { opacity: .55; } to { transform: translateX(-390px); opacity: 0; } }
    @keyframes glint { 0%,75%,100% { opacity: .12; transform: translateX(-7px); } 84% { opacity: .8; transform: translateX(7px); } }

    @media (max-width: 650px) {
      body { align-items: center; }
      .stage { width: calc(100vw - 16px); border-width: 3px; border-radius: 19px; }
      .topbar { padding: 12px; }
      .eyebrow { display: none; }
      .controls { flex-direction: column; }
      button { min-height: 38px; padding: 0 12px; font-size: .78rem; }
      .caption { left: 12px; bottom: 12px; padding: 7px 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #scene, #scene * { animation-duration: 1ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="黄色拉布拉多戴着头盔骑电瓶车的动画场景">

        <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffe17e"/>
          <stop offset=".58" stop-color="#f5b83e"/>
          <stop offset="1" stop-color="#d98c24"/>
        </linearGradient>
        <linearGradient id="scooter" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#67c8c2"/>
          <stop offset="1" stop-color="#24798d"/>
        </linearGradient>
        <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
          <feGaussianBlur stdDeviation="8"/>
        </filter>
        <clipPath id="scene-clip"><rect width="1200" height="675" rx="24"/></clipPath>
      </defs>

        <g class="clouds-far" fill="#fff7e9" opacity=".54">

            <g transform="translate(1060 310) scale(1.08)"><rect x="-8" y="67" width="16" height="85" rx="6" fill="#7c5236"/><path d="M0 0L-45 78H45Z" fill="#2f7964"/><path d="M0 35L-55 115H55Z" fill="#3c9471"/></g>

    <p class="caption">安全第一，快乐第二，耳朵顺风第三。</p>
  </main>

  <script>
    const scene = document.querySelector('#scene');
    const toggle = document.querySelector('#toggle');
    const speed = document.querySelector('#speed');

    toggle.addEventListener('click', () => {
      const paused = scene.classList.toggle('paused');
      toggle.setAttribute('aria-pressed', String(paused));
      toggle.textContent = paused ? '▶ 继续' : '❚❚ 暂停';
    });

    speed.addEventListener('click', () => {
      const fast = scene.classList.toggle('fast');
      speed.setAttribute('aria-pressed', String(fast));
      speed.textContent = fast ? '×1.6 速度' : '×1 速度';
    });
  </script>
</body>
</html>
